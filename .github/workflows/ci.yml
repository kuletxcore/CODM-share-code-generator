name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - run: npm run lint

      # `next typegen` runs first: the route types (LayoutProps, PageProps) are
      # generated, so a bare `tsc --noEmit` on a clean checkout fails.
      - run: npm run typecheck

      - run: npm test

      # The deploy is a static export, so a green build is the deployable
      # artifact; catching it here keeps a broken main out of Workers Builds.
      - run: npm run build
