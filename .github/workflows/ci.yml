name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        run: npm ci

      # Agent instruction files are generated from AGENTS.md. Fail fast and with a
      # clear message if someone edited one of the mirrors by hand or forgot to
      # re-run the sync after changing the source.
      - name: Agent instructions are in sync
        run: npm run agents:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
